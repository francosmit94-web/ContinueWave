<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0; url=homepage.html" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AtlasFlow | Redirecting</title>
    <meta
      name="description"
      content="Redirecting to the AtlasFlow homepage."
    />
    <link rel="canonical" href="https://implementationpages.vercel.app/" />
    <style>
      :root {
        --bg: #f4f0ea;
        --ink: #121416;
        --muted: #536066;
        --line: #d5cdc1;
        --brand: #214c65;
        --card: #fbf8f4;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 0% 0%, #f9f5ed 0%, transparent 42%),
          radial-gradient(circle at 100% 0%, #e4edf4 0%, transparent 38%),
          linear-gradient(180deg, var(--bg) 0%, #faf7f2 100%);
      }

      .card {
        width: min(680px, 92vw);
        padding: 1.4rem;
        border-radius: 1rem;
        border: 1px solid var(--line);
        background: var(--card);
      }

      h1 {
        margin: 0 0 0.8rem;
        line-height: 1.1;
        font-size: clamp(1.8rem, 4.4vw, 2.8rem);
      }

      p {
        margin: 0 0 1rem;
        color: var(--muted);
        line-height: 1.45;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.8rem;
        margin-top: 1rem;
      }

      .btn {
        display: inline-block;
        text-decoration: none;
        padding: 0.72rem 1.1rem;
        border-radius: 999px;
        border: 1px solid transparent;
        font-weight: 700;
      }

      .btn-primary {
        background: var(--brand);
        border-color: var(--brand);
        color: #fff;
      }

      .btn-secondary {
        background: #e9f1f7;
        border-color: #bcd0dd;
        color: var(--brand);
      }
    </style>
    <script>
      window.location.replace("homepage.html");
    </script>
  </head>
  <body>
    <main class="card">
      <h1>Redirecting to AtlasFlow</h1>
      <p>
        If the homepage does not open automatically, use one of the links below.
      </p>
      <div class="actions">
        <a class="btn btn-primary" href="homepage.html">Open Homepage</a>
        <a class="btn btn-secondary" href="strategy_call.html">Book a Call</a>
      </div>
    </main>
    <script src="assets/site-config.js" defer></script>
    <script src="assets/site-runtime.js" defer></script>
  </body>
</html>
